name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Knowledge policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/test_policy.py -q
      - name: Compile Python sources
        run: python -m compileall -q server tests

  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\Test-Installer.ps1
      - name: WPF construction and preview
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File installer\Gui.ps1 -SmokeTest -PreviewPath "$env:RUNNER_TEMP\installer.png"
      - name: Release archive and extracted entry point
        shell: powershell
        run: |
          .\scripts\New-ReleasePackage.ps1 -OutputPath "$env:RUNNER_TEMP\agent-brain.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\agent-brain.zip" -DestinationPath "$env:RUNNER_TEMP\brain-package"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\brain-package\agent-brain\Install-AgentBrain.ps1" -DetectionOnly
          if ($LASTEXITCODE -ne 0) { throw 'Extracted entry point failed.' }
